<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZSafetyBMR — Map Prototype</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1E1C;
    --panel:#16302B;
    --panel-2:#1E3B34;
    --paper:#E9E3D3;
    --paper-dim:#c9c2ae;
    --line: rgba(233,227,211,0.14);
    --teal:#2FA88A;
    --grey-pin:#4A4A4A;
    --brown-pin:#8A5A3B;
    --green-zone:#3FA07E;
    --slum-zone:#B08840;
    --rec-zone:#4C86B0;
    --text:#EDEAE0;
    --text-dim:#A9B8B3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
  #app{display:flex;flex-direction:column;height:100%;}

  header{
    padding:18px 26px 14px 26px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    background:linear-gradient(180deg, var(--panel) 0%, var(--ink) 100%);
    z-index:10;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--text-dim);font-weight:500;}
  .disclaimer{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-dim);
    max-width:360px;
    line-height:1.5;
    border-left:2px solid var(--slum-zone);
    padding-left:10px;
  }

  #main{position:relative;flex:1;min-height:0;}
  #map{position:absolute;inset:0;background:var(--ink);}

  .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9) saturate(0.6);}

  /* --- layer stack: signature element, film-strip tabs on the right --- */
  #layerstack{
    position:absolute;
    top:16px;
    right:16px;
    z-index:800;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:250px;
  }
  .film{
    background:rgba(22,48,43,0.94);
    backdrop-filter:blur(6px);
    border:1px solid var(--line);
    border-left:3px solid var(--sheet-color, var(--teal));
    border-radius:2px;
    padding:10px 12px;
    transition:transform .15s ease, background .15s ease;
    cursor:pointer;
    user-select:none;
  }
  .film:hover{transform:translateX(-3px);}
  .film-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .film-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13px;
  }
  .film-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--text-dim);
  }
  .swatch{width:11px;height:11px;border-radius:2px;flex-shrink:0;}
  .toggle{
    width:30px;height:16px;border-radius:9px;background:rgba(233,227,211,0.18);
    position:relative;flex-shrink:0;transition:background .15s;
  }
  .toggle::after{
    content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:var(--paper-dim);transition:transform .15s, background .15s;
  }
  .film.on .toggle{background:var(--teal);}
  .film.on .toggle::after{transform:translateX(14px);background:var(--paper);}
  .film-sub{
    margin-top:6px;font-size:11px;color:var(--text-dim);line-height:1.4;
    display:flex;flex-wrap:wrap;gap:6px;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    padding:2px 6px;border-radius:10px;border:1px solid var(--line);
    color:var(--text-dim);
  }

  /* legend footer */
  #legend{
    position:absolute; bottom:16px; left:16px; z-index:800;
    background:rgba(22,48,43,0.94);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:2px;
    padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:var(--text-dim);display:flex;gap:16px;flex-wrap:wrap;max-width:80vw;
  }
  #legend div{display:flex;align-items:center;gap:6px;}
  #legend .dot{width:9px;height:9px;border-radius:50%;}
  #legend .box{width:10px;height:10px;border-radius:2px;opacity:0.75;}

  #databadge{
    position:absolute;top:16px;left:16px;z-index:800;
    background:rgba(176,136,64,0.16);
    border:1px solid var(--slum-zone);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:0.04em;
    padding:6px 10px;border-radius:2px;
    max-width:260px;
  }

  .leaflet-popup-content-wrapper{
    background:var(--panel-2);color:var(--text);border-radius:3px;
    font-family:'IBM Plex Sans',sans-serif;border:1px solid var(--line);
  }
  .leaflet-popup-tip{background:var(--panel-2);}
  .pop-eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;
    letter-spacing:0.1em;color:var(--teal);display:block;margin-bottom:4px;
  }
  .pop-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin:0 0 4px 0;}
  .pop-body{font-size:12px;color:var(--text-dim);line-height:1.5;}

  .district-label{
    background:none;border:none;box-shadow:none;
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    color:rgba(233,227,211,0.75);text-shadow:0 0 3px rgba(15,30,28,0.9);
  }
  .leaflet-tooltip.district-label::before{display:none;}
  .pin-icon{
    width:16px;height:16px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:1.5px solid rgba(233,227,211,0.55);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Bangkok Metropolitan Region · Safety Map</span>
      <h1>Z<span>SafetyBMR</span> — map</h1>
    </div>
    <div class="disclaimer">
      Working prototype. District boundaries are real (geoBoundaries, CC-BY 4.0). Zone shapes, pins and submissions are placeholder demo data for layout/interaction testing only.
    </div>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="databadge">SAMPLE DATA — for prototyping map interaction only</div>
    <div id="layerstack"></div>
    <div id="legend"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ---------- map setup ----------
const map = L.map('map', {zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

// Bangkok Metropolitan Region — six provinces
const bmrProvinces = [
  {name:'Bangkok',        lat:13.7563, lng:100.5018},
  {name:'Nonthaburi',     lat:13.8622, lng:100.5144},
  {name:'Pathum Thani',   lat:14.0208, lng:100.5250},
  {name:'Samut Prakan',   lat:13.5991, lng:100.5998},
  {name:'Nakhon Pathom',  lat:13.8196, lng:100.0645},
  {name:'Samut Sakhon',   lat:13.5475, lng:100.2740}
];

const provinceLayer = L.layerGroup();
bmrProvinces.forEach(p=>{
  L.marker([p.lat,p.lng], {
    icon: L.divIcon({
      className:'',
      html:`<div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#E9E3D3;background:rgba(22,48,43,0.85);border:1px solid rgba(233,227,211,0.3);padding:2px 7px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-50%);">${p.name}</div>`,
      iconSize:[0,0]
    })
  }).addTo(provinceLayer);
});
provinceLayer.addTo(map);

const bmrBounds = L.latLngBounds(bmrProvinces.map(p=>[p.lat,p.lng]));
map.fitBounds(bmrBounds, {padding:[60,60]});

async function initData(){
  const [districtGeojson, parksCompact] = await Promise.all([
    fetch('districts.geojson').then(r => r.json()),
    fetch('parks.json').then(r => r.json())
  ]);

// ---------- BASE LAYER: real district boundaries ----------
const provinceColors = {
  'Bangkok':'#00744b', 'Nonthaburi':'#d84615', 'Pathum Thani':'#011264',
  'Samut Prakan':'#4697d2', 'Nakhon Pathom':'#003e7c', 'Samut Sakhon':'#ff9dc9'
};

const districtLayer = L.geoJSON(districtGeojson, {
  style: f => ({
    color: 'rgba(233,227,211,0.55)',
    weight: 1,
    fillColor: provinceColors[f.properties.province] || '#4A4A4A',
    fillOpacity: 0.10
  }),
  onEachFeature: (feature, layer) => {
    const p = feature.properties;
    layer.bindPopup(`<span class="pop-eyebrow">${p.province} · district</span><p class="pop-title">${p.district}</p>`);
    layer.bindTooltip(p.district, {
      permanent:false, direction:'center', className:'district-label', opacity:0.9
    });
    layer.on('mouseover', () => layer.setStyle({weight:2.5, fillOpacity:0.30, color:'#E9E3D3'}));
    layer.on('mouseout', () => layer.setStyle({weight:1, fillOpacity:0.10, color:'rgba(233,227,211,0.55)'}));
  }
});

// ---------- SAMPLE DATA (placeholder only) ----------

// Dataset 1b: point amenities
const amenities = [
  {name:'Sample Public Library', kind:'library', lat:13.7466, lng:100.5347},
  {name:'Sample Community Clinic', kind:'clinic', lat:13.7605, lng:100.5380},
  {name:'Sample Police Station', kind:'police', lat:13.7280, lng:100.5230}
];

// Dataset 2: anonymous submissions (dark grey pins)
const submissions = [
  {place:'Near Sample Transit Station', lat:13.7440, lng:100.5610,
   note:'Demo entry: placeholder text describing an exclusionary incident reported nearby. (Sample data, not a real submission.)'},
  {place:'Sample Public Park Corner', lat:13.7900, lng:100.5490,
   note:'Demo entry: placeholder note about a reported pattern of teasing. (Sample data.)'}
];

// Dataset 3: school/safety pins (brown pins)
const safetySites = [
  {name:'Sample Secondary School A', lat:13.7700, lng:100.5600,
   ratio:'1:28', psychologist:'On-site, 2 days/week', lighting:'Adequate', cctv:'Present'},
  {name:'Sample Secondary School B', lat:13.7150, lng:100.5700,
   ratio:'1:41', psychologist:'Not available', lighting:'Poor on approach roads', cctv:'Absent'}
];

const parkLayer = L.layerGroup();
const PARK_TAG_COLOR = { park:'#3FA07E', recreation_ground:'#3FA07E', nature_reserve:'#2FA88A', garden:'#5CBF8E' };
const PARK_TAG_LABEL = { park:'park', recreation_ground:'recreation ground', nature_reserve:'nature reserve', garden:'garden' };
parksCompact.forEach(p=>{
  const ring = p.r[0].map(([lng,lat]) => [lat,lng]);
  L.polygon(ring, { color: PARK_TAG_COLOR[p.t] || '#3FA07E', weight:1, fillColor: PARK_TAG_COLOR[p.t] || '#3FA07E', fillOpacity:0.32 })
    .bindPopup(`<span class="pop-eyebrow">${PARK_TAG_LABEL[p.t] || p.t}</span><p class="pop-title">Green space</p>`)
    .addTo(parkLayer);
});

function dotIcon(color){
  return L.divIcon({className:'', html:`<div class="pin-icon" style="background:${color}"></div>`, iconSize:[16,16], iconAnchor:[8,16]});
}

const amenityLayer = L.layerGroup();
const amenityColor = {library:'#2FA88A', clinic:'#C97A4A', police:'#5A7FC9'};
amenities.forEach(a=>{
  L.marker([a.lat,a.lng], {icon:dotIcon(amenityColor[a.kind])})
    .bindPopup(`<span class="pop-eyebrow">${a.kind}</span><p class="pop-title">${a.name}</p>`)
    .addTo(amenityLayer);
});

const submissionLayer = L.layerGroup();
submissions.forEach(s=>{
  L.marker([s.lat,s.lng], {icon:dotIcon('#4A4A4A')})
    .bindPopup(`<span class="pop-eyebrow">Anonymous submission</span><p class="pop-title">${s.place}</p><p class="pop-body">${s.note}</p>`)
    .addTo(submissionLayer);
});

const safetyLayer = L.layerGroup();
safetySites.forEach(s=>{
  L.marker([s.lat,s.lng], {icon:dotIcon('#8A5A3B')})
    .bindPopup(`<span class="pop-eyebrow">School safety profile</span><p class="pop-title">${s.name}</p>
      <p class="pop-body">Teacher:student — ${s.ratio}<br>School psychologist — ${s.psychologist}<br>Street lighting — ${s.lighting}<br>CCTV — ${s.cctv}</p>`)
    .addTo(safetyLayer);
});

// ---------- layer stack UI (signature element) ----------
const layerConfig = [
  {id:'parks', title:'Parks & green space', code:'DS-1A-REAL', color:'#3FA07E', layer:parkLayer, on:true,
   chips:['park','garden','recreation ground','OSM']},
  {id:'districts', title:'District boundaries', code:'BASE', color:'#6E8B85', layer:districtLayer, on:true,
   chips:['79 districts','6 provinces']},
  {id:'amenities', title:'Public amenities', code:'DS-1B', color:'#2FA88A', layer:amenityLayer, on:true,
   chips:['library','clinic','police']},
  {id:'submissions', title:'Anonymous submissions', code:'DS-2', color:'#4A4A4A', layer:submissionLayer, on:true,
   chips:['dark grey pins']},
  {id:'safety', title:'School safety & context', code:'DS-3', color:'#8A5A3B', layer:safetyLayer, on:true,
   chips:['brown pins']}
];

const stack = document.getElementById('layerstack');
layerConfig.forEach(cfg=>{
  cfg.layer.addTo(map);
  const el = document.createElement('div');
  el.className = 'film on';
  el.style.setProperty('--sheet-color', cfg.color);
  el.innerHTML = `
    <div class="film-head">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="swatch" style="background:${cfg.color}"></div>
        <div class="film-title">${cfg.title}</div>
      </div>
      <div class="toggle"></div>
    </div>
    <div class="film-sub">
      <span class="film-code">${cfg.code}</span>
      ${cfg.chips.map(c=>`<span class="chip">${c}</span>`).join('')}
    </div>
  `;
  el.addEventListener('click', ()=>{
    cfg.on = !cfg.on;
    el.classList.toggle('on', cfg.on);
    if(cfg.on){ cfg.layer.addTo(map); } else { map.removeLayer(cfg.layer); }
  });
  stack.appendChild(el);
});

// ---------- legend ----------
document.getElementById('legend').innerHTML = `
  <div><span class="box" style="background:#3FA07E"></span>green space</div>
  <div><span class="box" style="background:#B08840"></span>informal settlement</div>
  <div><span class="box" style="background:#4C86B0"></span>recreation</div>
  <div><span class="dot" style="background:#4A4A4A"></span>anonymous submission</div>
  <div><span class="dot" style="background:#8A5A3B"></span>school / safety</div>
`;


} // end initData
initData();
</script>
</body>
</html>
